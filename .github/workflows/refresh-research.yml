name: Refresh Research Pipeline
on:
  schedule:
    # Backup starts; active windows collect every five minutes independently of cron.
    - cron: "9,29,49 * * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: Collection rounds in this finite window (five minutes apart)
        type: choice
        options: ['8', '2', '1']
        default: '8'
      continue_service:
        description: Start the next finite window automatically
        type: boolean
        default: true
      force_history:
        description: Recheck confirmed history on the first round
        type: boolean
        default: false
      force_components:
        description: Recheck international spot and FX on the first round
        type: boolean
        default: false
      force_analysis_ai:
        description: Refresh interpretation immediately and drain pending evidence
        type: boolean
        default: false
  workflow_call:
    inputs:
      rounds:
        type: string
        default: '1'
      continue_service:
        type: boolean
        default: false
      force_history:
        type: boolean
        default: false
      force_components:
        type: boolean
        default: false
      force_analysis_ai:
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: aurum-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.AURUM_UPDATES_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect, publish each round, and hand off the next window
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_ROUNDS: ${{ inputs.rounds || '8' }}
          CONTINUE_SERVICE: ${{ github.event_name == 'schedule' || inputs.continue_service }}
          FORCE_HISTORY: ${{ inputs.force_history || false }}
          FORCE_COMPONENTS: ${{ inputs.force_components || false }}
          FORCE_ANALYSIS_AI: ${{ inputs.force_analysis_ai || false }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          AURUM_CODEBUDDY_API_KEY: ${{ secrets.AURUM_CODEBUDDY_API_KEY }}
        run: node scripts/run-update-service.mjs
