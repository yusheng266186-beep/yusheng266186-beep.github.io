name: Refresh Research Pipeline
on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
    inputs:
      force_history:
        description: Refresh confirmed history as well
        type: boolean
        default: false
  workflow_call:
    inputs:
      force_history:
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: aurum-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect independently and retain dated fallbacks
        env:
          FORCE_HISTORY: ${{ inputs.force_history || false }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ "$FORCE_HISTORY" = "true" ]; then
            node scripts/refresh-research.mjs --force-history
          else
            node scripts/refresh-research.mjs
          fi
      - name: Commit inputs and health receipt
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh AURUM research and collector health"
          file_pattern: data/*.json data/embedded-data.js
      - name: Report collector failures after preserving recovery data
        run: |
          node --input-type=module -e 'import fs from "node:fs";const h=JSON.parse(fs.readFileSync("data/pipeline-health.json"));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,JSON.stringify(h,null,2));if(h.status==="failed")process.exit(1);if(h.status==="partial")console.log("::warning::Partial source failure; dated inputs retained. See pipeline-health.json.");'
