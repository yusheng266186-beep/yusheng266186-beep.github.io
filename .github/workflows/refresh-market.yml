name: Refresh Market Snapshot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-data-refresh
  cancel-in-progress: false

jobs:
  refresh-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch domestic gold market snapshot
        run: node scripts/fetch-market-snapshot.mjs
      - name: Rebuild direct-open data
        run: node scripts/build-embedded-data.mjs
      - name: Commit snapshot
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh gold market snapshot"
          file_pattern: data/market-snapshot.json data/embedded-data.js
