name: Research Recovery Watchdog
on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_run:
    workflows: ["Refresh Research Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force_recovery:
        description: Start collection when no active window exists
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: aurum-research-watchdog
  cancel-in-progress: false
jobs:
  heartbeat:
    if: vars.AURUM_UPDATES_PAUSED != 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore a missing or stalled collection window
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RECOVERY: ${{ inputs.force_recovery || false }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: node scripts/check-update-service.mjs
