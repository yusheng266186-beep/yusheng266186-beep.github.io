<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://1459223409-lnoxklunue.ap-chengdu.tencentscf.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080909">
  <title>AURUM · 黄金分析模型后台</title>
  <link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/fonts.css?v=5.3.10">
  <link rel="stylesheet" href="admin.css?v=2">
  <link rel="stylesheet" href="../assets/native-controls.css?v=5.3.10">
  <script src="admin.js?v=2" type="module"></script>
</head>
<body class="aurum-admin">
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="../"><strong>AURUM</strong><small>返回黄金工作台</small></a>
      <button type="button" class="quiet-button" id="logout" hidden>退出后台</button>
    </div>
  </header>
  <main>
    <h1 id="adminTitle" tabindex="-1">黄金分析模型后台</h1>
    <p id="feedback" role="status" hidden></p>
    <form id="login" class="panel login">
      <h2>验证码登录</h2>
      <p id="codeHint" class="note">输入验证器里「AURUM 黄金分析后台」的 6 位动态验证码。</p>
      <label for="code">动态验证码</label>
      <div class="login-fields">
        <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" aria-describedby="codeHint" required spellcheck="false">
        <button class="primary" type="submit">进入后台</button>
      </div>
    </form>
    <div id="workspace" hidden>
      <section class="panel" aria-labelledby="active-title">
        <div class="section-head">
          <h2 id="active-title">生产配置</h2>
          <button type="button" id="reload" class="quiet-button">回读云端</button>
        </div>
        <dl class="receipt" id="receipt" hidden>
          <div><dt>模型与思考强度</dt><dd id="active-model"></dd></div>
          <div><dt>服务</dt><dd id="active-provider"></dd></div>
          <div id="active-account-row"><dt>账号</dt><dd id="active-account"></dd></div>
          <div><dt>更新时间</dt><dd id="active-time"></dd></div>
        </dl>
      </section>
      <div class="admin-grid" id="configuration" hidden>
        <form id="selection" class="panel" aria-labelledby="selection-title">
          <h2 id="selection-title">切换模型</h2>
          <div class="fields">
            <div><label for="provider">服务</label><select id="provider" required></select></div>
            <div><label for="model">模型</label><select id="model" required></select></div>
            <div><label for="effort">思考强度</label><select id="effort" required></select></div>
            <div id="account-field"><label for="account">云端账号</label><select id="account"></select></div>
          </div>
          <p class="note">保存后，下一次符合调度条件的新闻审阅会使用新配置。</p>
          <div class="actions">
            <button type="button" id="test">测试连通</button>
            <button class="primary" type="submit" id="save">保存并切换</button>
          </div>
        </form>
        <section class="panel" aria-labelledby="quota-title" id="quota" hidden>
          <div class="section-head">
            <h2 id="quota-title">ChatGPT 额度</h2>
            <button type="button" id="calibrate" class="quiet-button">校准额度</button>
          </div>
          <p id="quota-account" class="quota-account"></p>
          <div id="quota-windows" class="quota-windows"></div>
          <p id="quota-updated" class="note quota-updated"></p>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
