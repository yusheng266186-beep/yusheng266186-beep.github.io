<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.tencentscf.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="dark">
  <title>黄金分析 · 模型后台</title>
  <link rel="stylesheet" href="admin.css?v=1">
  <script src="admin.js?v=1" type="module"></script>
</head>
<body>
  <main>
    <header class="masthead">
      <a class="back" href="../">‹ 黄金工作台</a>
      <button type="button" class="text-button" id="logout" hidden>退出后台</button>
    </header>
    <h1>黄金分析 · 模型后台</h1>
    <form id="login" class="panel login">
      <label for="key">后台访问密钥</label>
      <div class="login-fields">
        <input id="key" type="password" required autocomplete="current-password" spellcheck="false">
        <button class="primary" type="submit">进入后台</button>
      </div>
    </form>
    <p id="feedback" role="status" aria-live="polite" hidden></p>
    <div id="workspace" hidden>
      <section class="panel" aria-labelledby="active-title">
        <div class="section-head">
          <h2 id="active-title">生产配置</h2>
          <button type="button" id="reload" class="text-button">回读云端</button>
        </div>
        <dl class="receipt">
          <div><dt>服务</dt><dd id="active-provider"></dd></div>
          <div><dt>模型 / 思考强度</dt><dd id="active-model"></dd></div>
          <div id="active-account-row"><dt>账号</dt><dd id="active-account"></dd></div>
          <div><dt>更新时间</dt><dd id="active-time"></dd></div>
        </dl>
      </section>
      <form id="selection" class="panel" aria-labelledby="selection-title">
        <h2 id="selection-title">切换模型</h2>
        <div class="fields">
          <label for="provider">服务<select id="provider" required></select></label>
          <label for="model">模型<select id="model" required></select></label>
          <label for="effort">思考强度<select id="effort" required></select></label>
          <label for="account" id="account-field">共享云端账号<select id="account"></select></label>
        </div>
        <p id="quota" class="note" hidden></p>
        <p class="note">保存后，下一次符合调度条件的 GitHub Actions 研判会使用新配置。</p>
        <div class="actions">
          <button type="button" id="test">测试连通</button>
          <button class="primary" type="submit">保存并切换</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
